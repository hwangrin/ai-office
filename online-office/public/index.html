  :root {
    --mono: 'Chivo Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --bg: #0b0c0e; --panel: rgba(16,17,19,.9); --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
    --text: #ece8df; --muted: #9b978d; --gold: #d9b46a; --gold-dim: rgba(217,180,106,.14);
    --ok: #7fd1a0; --warn: #ff9a4d; --err: #ff6b6b; --blue: #8fb3ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  #stage { position: fixed; inset: 14px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #05070d; }
  #stage canvas { display: block; }

  .card { position: absolute; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #hud { top: 14px; left: 14px; padding: 14px 18px; max-width: min(370px, calc(100% - 28px)); z-index: 4; }
  #hud .eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #hud .eyebrow { font-size: 11px; letter-spacing: .16em; color: var(--gold); text-transform: uppercase; font-weight: 600; }
  #hud .clock-badge { font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--text); background: rgba(255,255,255,.04); white-space: nowrap; }
  #hud .clock-badge.is-day { border-color: rgba(143,179,255,.45); color: #dce9ff; }
  #hud .clock-badge.is-night { border-color: rgba(217,180,106,.45); color: var(--gold); }
  #hud h1 { margin: 6px 0 6px; }
  #hud p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
  #hud .count { color: var(--gold); font-weight: 600; font-size: 13px; }
  #viewer-banner { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  #viewer-banner .vb-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .vb-pill { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; text-transform: uppercase; border: 1px solid var(--line-2); }
  .vb-pill.disconnected { color: var(--warn); border-color: rgba(255,154,77,.45); background: rgba(255,154,77,.08); }
  .vb-pill.readonly { color: var(--blue); border-color: rgba(143,179,255,.45); background: rgba(143,179,255,.08); }
  .vb-pill.mock { color: var(--ok); border-color: rgba(127,209,160,.45); background: rgba(127,209,160,.08); }

  #toolbar { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 62%; z-index: 4; }
  .btn { background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 12px; cursor: pointer; white-space: nowrap; backdrop-filter: blur(10px); }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; }
  .btn.danger { color: var(--err); }
  .btn.small { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
  .btn.ghost { color: var(--muted); }

  #feed { right: 14px; bottom: 14px; width: min(360px, calc(100% - 28px)); padding: 10px 14px; font-size: 12.5px; max-height: 30%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; background: transparent; border: none; backdrop-filter: none; }
  #feed div { color: #e2ddd1; text-shadow: 0 1px 3px #000, 0 0 8px #000; margin-top: 3px; }
  #feed b { color: var(--gold); font-weight: 500; }
  #hint { position: absolute; left: 14px; bottom: 10px; font-size: 11.5px; color: var(--muted); pointer-events: none; text-shadow: 0 1px 3px #000; }

  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #05070d; z-index: 8; transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .box { text-align: center; color: var(--muted); }
  #loading .box b { display: block; font: 600 18px var(--mono); color: var(--text); margin-bottom: 6px; }

  /* Panel nhân viên */
  #panel { top: 14px; right: 14px; bottom: 14px; width: 400px; display: none; flex-direction: column; z-index: 5; }
  #panel.open { display: flex; }
  body.panel-open #toolbar { right: 428px; left: 392px; max-width: none; }
  body.panel-open #feed { display: none; }
  #panel header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #panel header h2 { margin: 0; }
  #panel .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  #panel .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); }
  .chip.status-working { color: var(--gold); border-color: var(--gold); }
  .chip.status-waiting { color: var(--warn); border-color: var(--warn); }
  .chip.status-error { color: var(--err); border-color: var(--err); }
  .chip.status-queued { color: var(--blue); border-color: var(--blue); }
  .chip.kind-subagent { color: var(--blue); border-color: rgba(143,179,255,.55); }
  #panel .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  #perms { padding: 0 16px; }
  .perm { margin-top: 10px; border: 1px solid var(--warn); border-radius: 10px; padding: 10px; background: rgba(255,154,77,.07); }
  .perm pre { margin: 6px 0 8px; max-height: 120px; overflow: auto; font-size: 11.5px; white-space: pre-wrap; word-break: break-word; color: #e9d9c8; }
  #log { flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
  .ev { font-size: 13px; border-left: 2px solid var(--line-2); padding-left: 10px; white-space: pre-wrap; word-break: break-word; }
  .ev time { color: var(--muted); font-size: 11px; display: block; }
  .ev.k-message { border-color: var(--text); }
  .ev.k-tool { border-color: var(--blue); color: #c9d6f5; font-family: ui-monospace, monospace; font-size: 12px; }
  .ev.k-task { border-color: var(--gold); }
  .ev.k-result { border-color: var(--ok); color: var(--ok); }
  .ev.k-error { border-color: var(--err); color: var(--err); }
  .ev.k-permission { border-color: var(--warn); color: var(--warn); }
  .ev.k-system { color: var(--muted); font-size: 12px; }
  #composer { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .composer-row { display: flex; gap: 8px; align-items: stretch; }
  .btn.icon { padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; }
  .atts { display: flex; flex-wrap: wrap; gap: 6px; }
  .atts:empty { display: none; }
  .att { position: relative; display: flex; align-items: center; gap: 6px; max-width: 190px; padding: 4px 22px 4px 4px; border: 1px solid var(--line-2); border-radius: 9px; background: rgba(255,255,255,.04); font-size: 11.5px; }
  .att img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; display: block; }
  .att .ficon { width: 38px; height: 38px; border-radius: 6px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--gold); text-transform: uppercase; }
  .att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }
  .att .nm small { display: block; color: var(--muted); font-size: 10.5px; }
  .att .x { position: absolute; top: 2px; right: 3px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px; }
  .att .x:hover { color: var(--text); }
  .att.uploading { opacity: .55; }
  .att.err { border-color: var(--err); }
  .drop-hint { display: none; position: absolute; inset: 4px; border: 1.5px dashed var(--gold); border-radius: 12px; background: rgba(20,16,10,.85); color: var(--gold); align-items: center; justify-content: center; font-size: 13px; pointer-events: none; }
  .dragging .drop-hint { display: flex; }
  .ev-atts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ev-atts a { display: inline-flex; align-items: center; gap: 6px; color: var(--text); text-decoration: none; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 8px 3px 3px; font-size: 11.5px; max-width: 200px; }
  .ev-atts a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-atts img { width: 64px; height: 48px; object-fit: cover; border-radius: 6px; display: block; }
  .ev-atts a.img { padding: 0; border: 0; }
  .ev-atts .ficon { width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; color: var(--gold); text-transform: uppercase; }
  .brief-drop { position: relative; }
  #composer textarea { flex: 1; resize: none; height: 64px; background: rgba(255,255,255,.04); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; }
  #composer textarea:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); }

  /* Modal */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #modal.open { display: flex; }
  #modal .box { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; position: relative; padding: 18px 20px; }
  #modal h3 { margin: 0 0 12px; font: 600 16px var(--mono); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { background: rgba(255,255,255,.04); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 10px; }
  .field input[type=color] { padding: 2px; height: 36px; }
  .field select option { background: #1b1d1c; }
  .field textarea { min-height: 80px; resize: vertical; }
  .field small { color: var(--muted); font-size: 11.5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .demo-pick { display:block; width:100%; text-align:left; margin:6px 0; padding:10px 12px; }
  .demo-pick span { display:block; font-size:12px; opacity:.75; margin-top:2px; font-weight:400; }
  #demo-bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(640px,calc(100vw - 20px)); z-index:15; background:rgba(14,16,26,.94); border:1px solid #6d5bd0; border-radius:12px; padding:10px 14px; color:#eef0ff; box-shadow:0 8px 30px rgba(0,0,0,.45); max-height:46vh; overflow-y:auto; }
  .demo-ribbon { background:#6d5bd0; color:#fff; font:700 11px/1 system-ui; letter-spacing:.04em; padding:5px 8px; border-radius:6px; margin:-2px 0 8px; text-align:center; }
  .demo-head { display:flex; justify-content:space-between; gap:8px; font-size:14px; margin-bottom:6px; }
  .demo-time { opacity:.7; font-size:12px; }
  .demo-steps { list-style:none; margin:0; padding:0; font-size:12.5px; }
  .demo-steps li { display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:center; padding:3px 0; opacity:.6; }
  .demo-steps li em { font-style:normal; font-size:11px; opacity:.85; }
  .demo-steps .ds-dot { width:9px; height:9px; border-radius:50%; background:#667; }
  .demo-steps .ds-active { opacity:1; } .demo-steps .ds-active .ds-dot { background:#4fb3ff; box-shadow:0 0 6px #4fb3ff; }
  .demo-steps .ds-waiting { opacity:1; color:#ffb347; } .demo-steps .ds-waiting .ds-dot { background:#ffb347; }
  .demo-steps .ds-done { opacity:.9; } .demo-steps .ds-done .ds-dot { background:#5fd08a; }
  .demo-who { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; opacity:.7; margin:6px 0; }
  .demo-ctl { display:flex; flex-wrap:wrap; gap:6px; } .demo-ctl .btn { min-height:34px; }
  .demo-live { margin-left:auto; border-color:#5fd08a; }
  .demo-note { font-size:12px; opacity:.8; margin:6px 0 0; }
  body.demo-on #feed { display:none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .sess { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
  .sess .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .sess .pv { margin: 4px 0 8px; font-size: 13px; }
  .warnbox { font-size: 12px; color: var(--warn); background: rgba(255,154,77,.07); border: 1px solid rgba(255,154,77,.35); border-radius: 9px; padding: 8px 10px; margin-bottom: 10px; }
  .chip.chip-cost { color: #cfe3c9; border-color: rgba(127,209,160,.45); }
  .muted { color: var(--muted); font-size: 12px; }
  .cost-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .cost-total { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .cost-total > div { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; }
  .cost-total small { color: var(--muted); font-size: 11.5px; display: block; }
  .cost-total b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .cost-total em { font-style: normal; font-size: 12px; color: var(--muted); display: block; font-weight: 400; }
  .daybars { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin-bottom: 12px; }
  .daybars div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .daybars span { display: block; width: 100%; background: var(--gold); border-radius: 3px 3px 0 0; opacity: .85; }
  .daybars em { font-style: normal; font-size: 9.5px; color: var(--muted); margin-top: 2px; }
  .cost-scroll { max-height: 34vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .cost-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .cost-table th { position: sticky; top: 0; background: #17181b; text-align: left; font-weight: 500; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line-2); }
  .cost-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .cost-table .num { text-align: right; white-space: nowrap; }
  .cost-table .model-row td { color: var(--muted); font-size: 11.5px; padding-top: 2px; padding-bottom: 4px; }
  .cost-note { font-size: 11.5px; color: var(--muted); line-height: 1.55; margin: 10px 0 0; }
  .cost-note code { background: rgba(255,255,255,.06); padding: 0 4px; border-radius: 4px; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2a1e10; border: 1px solid var(--gold); color: var(--text); padding: 8px 14px; border-radius: 10px; display: none; z-index: 30; max-width: 90vw; }

  @media (max-width: 760px) {
    #stage { inset: 0; border-radius: 0; border: none; }
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; }
    #feed, #hint, .desktop-only { display: none; }
    #toolbar { top: auto; bottom: 14px; right: 14px; left: 14px; justify-content: center; max-width: none; }
    body.panel-open #toolbar { display: none; }
    .row2 { grid-template-columns: 1fr; }
    .row4 { grid-template-columns: 1fr 1fr; }
  }

  /* ---- Slice C: DEMO HUD, composer, resizable panel, Javis section ---- */
  #hud-approvals.demo { cursor: default; background: #6d5bd0; color: #fff; }
  #hud-approvals.none.demo { background: none; color: var(--muted); border: 1px dashed var(--line-2); }
  body.demo-on #chat-composer { display: none !important; }

  body.panel-open #toolbar { right: calc(var(--panel-w, 400px) + 28px); }

  #p-convo[hidden] { display: none; }
  #panel.convo-open #p-javis, #panel.convo-open #log, #panel.convo-open #log-title, #panel.convo-open #perms { display: none; }

  #brain-wrap { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px/1.2 var(--mono); color: var(--muted); }
  #brain-wrap[hidden] { display: none; }
  #brain-select { font: 600 11px/1.2 var(--mono); color: var(--text, #e8ecf4); background: rgba(10,14,24,.78); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; min-height: 28px; max-width: 170px; }
  #brain-select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  @media (max-width: 700px) { #brain-select { min-height: 36px; } }
  #viewer-pills .chip-dir { font: 600 10.5px/1.2 var(--mono); padding: 3px 8px; min-height: 24px; border-radius: 99px; border: 1px solid rgba(217,180,106,.55); background: var(--gold-dim); color: var(--gold); cursor: pointer; }
  #viewer-pills .chip-dir:hover, #viewer-pills .chip-dir:focus-visible { background: rgba(217,180,106,.26); outline: none; }
  #p-min { display: none; }
  #panel .chip.role-director { border-color: rgba(217,180,106,.55); color: var(--gold); }
  #panel .chip.role-system { border-color: rgba(143,179,255,.5); color: var(--blue); }
  @media (max-width: 760px) {
    #viewer-pills .chip-dir { min-height: 32px; }
    body.has-composer #p-min { display: inline-flex; }
    /* The bottom composer stays reachable while a panel is open: the panel sits above it and shrinks with the on-screen keyboard. */
    body.panel-open.has-composer #chat-composer { display: flex; left: 50%; width: calc(100% - 16px); bottom: calc(8px + var(--kb, 0px)); }
    body.has-composer #chat-composer { bottom: calc(8px + var(--kb, 0px)); }
    body.has-composer #panel { bottom: calc(var(--cc-h, 76px) + 16px + var(--kb, 0px)); height: min(var(--panel-h, 52vh), calc(var(--vvh, 100dvh) - var(--cc-h, 76px) - 104px)); min-height: 0; }
    body.has-composer #panel.min { height: auto; }
    #panel.min > :not(header) { display: none !important; }
    #panel.min header > :not(h2):not(.meta):not(.actions) { display: none !important; }
    #panel.min header .actions button:not(#p-close):not(#p-min) { display: none !important; }
    body.kb-open #hint { display: none; }
    /* The toolbar rides above the composer even after the composer grows (typing shows its intent row), and steps aside for the keyboard. */
    body.has-composer #toolbar { bottom: calc(var(--cc-h, 76px) + 14px + var(--kb, 0px)); }
    body.kb-open #toolbar { display: none; }
  }
</style>

{ "imports": {

<body>
<div id="stage">
  <div id="loading"><div class="box"><b>Văn phòng ảo</b><span id="loading-text">Đang mở cửa văn phòng…</span></div></div>
  <div id="hud" class="card">
    <div class="eyebrow-row">
      <div class="eyebrow" id="hud-eyebrow">Văn phòng agency · Trực tiếp</div>
      <div class="clock-badge" id="hud-clock" title="Local wall clock &amp; Day/Night environment">--:--</div>
    </div>
    <h1 id="hud-title">Đang kết nối…</h1>
    <p id="hud-sub">Đèn chỉ sáng ở bàn có việc thật.</p>
    <p id="hud-comment" role="status" hidden><span class="cm-ic" aria-hidden="true">💬</span><span id="hud-comment-t" class="cm-t"></span><i id="hud-comment-tag" class="cm-tag" hidden></i></p>
    <div id="hud-metrics"></div>
    <div id="hud-progress"></div>
    <div class="count" id="hud-count"></div>
    <div id="hud-chips"></div>
    <button type="button" id="hud-approvals"></button>
    <div id="viewer-banner">
      <div class="vb-row" id="viewer-pills"></div>
      <div id="viewer-reason"></div>
    </div>
  </div>
  <div id="toolbar"><button class="btn" id="btn-mode">Application modes</button><button class="btn" id="btn-language">EN / VI</button><button class="btn" id="btn-roster">Employees</button><button class="btn" id="btn-history">Task history</button><button class="btn" id="btn-demo">DEMO</button><label id="brain-wrap" hidden><span class="brain-l">Brain</span><select id="brain-select" aria-label="Brain"></select></label>
    <button class="btn primary" id="btn-brief">Giao brief</button>
    <button class="btn" id="btn-add">+ Nhân viên</button>
    <button class="btn" id="btn-attach">Gắn phiên</button>
    <button class="btn desktop-only" id="btn-depts">Phòng ban</button>
    <button class="btn" id="btn-labels" title="Toggle floating agent name &amp; title labels (Always / Hover / Off)">Labels: Always</button>
    <button class="btn ghost" id="btn-overview">Toàn cảnh</button>
    <button class="btn ghost desktop-only" id="btn-quality">Chất lượng</button>
  </div>
  <div data-user-content id="feed" class="card"></div>
  <div id="agent-card" class="card" data-user-content role="status" aria-live="polite"></div>
  <div id="hint">Kéo để xoay · cuộn để phóng to · bấm vào nhân viên để xem chi tiết · nhấp đúp để đến gần</div>
  <div id="chat-composer" class="card" role="group" hidden>
    <div class="cc-top">
      <span id="cc-label" class="cc-label"></span>
      <div id="cc-intent" class="cc-intent" role="radiogroup"><button type="button" role="radio" data-intent="message" aria-checked="true"></button><button type="button" role="radio" data-intent="task" aria-checked="false"></button></div>
      <div id="cc-to" class="cc-to"></div>
    </div>
    <div class="cc-field">
      <textarea id="cc-input" rows="1" maxlength="2000" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cc-list"></textarea>
      <ul id="cc-list" role="listbox" hidden></ul>
    </div>
    <div class="cc-bottom">
      <span id="cc-note" class="cc-note" role="status"></span>
      <button type="button" class="btn small" id="cc-copy"></button>
      <a class="btn small primary" id="cc-open" target="_blank" rel="noopener noreferrer" aria-disabled="true"></a>
    </div>
  </div>
  <aside id="panel" class="card">
    <div id="panel-resizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize panel"></div>
    <header>
      <h2 data-user-content id="p-name"></h2>
      <div class="meta" data-user-content id="p-role"></div>
      <div class="chips" id="p-chips"></div>
      <div class="p-card" id="p-card" data-user-content></div>
      <div class="actions">
        <button class="btn small" id="p-history">Task history</button><button class="btn small" id="p-focus">Focus</button>
        <button class="btn small" id="p-stop">Dừng</button>
        <button class="btn small" id="p-reset">Phiên mới</button>
        <button class="btn small" id="p-edit">Sửa</button>
        <button class="btn small danger" id="p-del">Xoá</button>
        <button class="btn small" id="p-min" type="button" aria-expanded="true" aria-controls="panel">Thu gọn</button>
        <button class="btn small" id="p-close" style="margin-left:auto">Đóng</button>
      </div>
    </header>
    <div id="perms"></div>
    <div id="p-javis" hidden></div>
    <div id="p-convo" hidden></div>
    <div id="log-title" class="pj-h" hidden></div>
    <div data-user-content id="log"></div>
    <div id="composer">
      <div class="atts" id="p-atts"></div>
      <div class="composer-row">
        <button class="btn icon" id="p-attach" type="button" title="Đính kèm ảnh / tệp - hoặc dán ảnh (Ctrl+V), kéo thả tệp vào đây">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9"/></svg>
        </button>
        <textarea id="p-input" placeholder="Giao việc… dán ảnh Ctrl+V hoặc kéo thả tệp (Ctrl+Enter để gửi)"></textarea>
        <button class="btn primary" id="p-send">Giao</button>
      </div>
      <input type="file" id="p-file" multiple hidden />
      <div class="drop-hint">Thả tệp vào để đính kèm</div>
    </div>
  </aside>
</div>
<div id="modal"><div class="box card" id="modal-box"></div></div>
<div id="toast"></div>
<script type="module" src="/office/js/main.js"></script>
<script type="module" src="/office/js/viewer-controls.js"></script><link rel="stylesheet" href="/office/mobile-ux.css"><script type="module" src="/office/js/mobile-ux.js"></script><script type="module" src="/office/js/interactive-composer.js"></script><script type="module" src="/office/js/native-connection.js"></script></body>
</html>
